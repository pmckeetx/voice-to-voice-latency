[project]
name = "voice-to-voice-latency"
version = "0.1.0"
description = "Measure voice-to-voice latency on an OpenAI-Realtime-compatible endpoint, from a recorded caller"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real service; needs POLYAI_LIVE=1 and POLY_API_KEY"]
addopts = "-m 'not live'"
